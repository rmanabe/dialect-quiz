# Typecheck + unit tests on every push and PR.
#
# These guard the class of bug that got 1.0 (build 3) rejected: a purchase path
# whose failures were indistinguishable from success at the call site. The tests
# need no emulator, no store credentials and no EAS quota, so there is no reason
# not to run them on every commit.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the version the suite was verified on. Node runs the
          # TypeScript sources directly, so the tests need no build step and no
          # test-framework dependency.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
