name: Upload iOS build to App Store Connect (direct, no EAS queue)

# Uploads an .ipa straight to App Store Connect with Apple's own notarytool /
# altool, bypassing EAS Submit. EAS Submit is free but runs through a shared
# "Free Tier Queue" that can sit unstarted for a long time; this path talks to
# Apple directly and finishes in a few minutes.
#
# Two ways to supply the .ipa:
#   - run_id: download the artifact from a previous "Production build" run
#             (the normal case — build once, upload that exact binary)
#   - build:  build a fresh signed .ipa in this run, then upload it
#
# Required repository secrets (App Store Connect API key, Admin or App Manager):
#   ASC_KEY_ID      e.g. JG5XUHJV6C
#   ASC_ISSUER_ID   e.g. 69a6de90-6437-47e3-e053-5b8c7c11a4d1
#   ASC_PRIVATE_KEY the full contents of the AuthKey_XXXXXXXXXX.p8 file
# EXPO_TOKEN is only needed when source == build.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where the .ipa comes from"
        required: true
        default: "run_id"
        type: choice
        options: [run_id, build]
      run_id:
        description: "Run ID of the Production build workflow (when source = run_id)"
        required: false
        default: ""
      prefecture:
        description: "EXPO_PUBLIC_PREFECTURE value"
        required: true
        default: "osaka"

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_PREFECTURE: ${{ inputs.prefecture }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # --- Option 1: reuse the .ipa from an earlier build run ---------------
      - name: Download .ipa from a previous build run
        if: ${{ inputs.source == 'run_id' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-production-${{ inputs.prefecture }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./ipa

      # --- Option 2: build a fresh signed .ipa in this run ------------------
      - uses: actions/setup-node@v4
        if: ${{ inputs.source == 'build' }}
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ inputs.source == 'build' }}
        run: npm ci

      - name: Install eas-cli
        if: ${{ inputs.source == 'build' }}
        run: npm install -g eas-cli

      - name: Build iOS (signed, local, no EAS credits)
        if: ${{ inputs.source == 'build' }}
        run: |
          mkdir -p ./ipa
          eas build --local \
            --platform ios \
            --profile production \
            --non-interactive \
            --output=./ipa/dialect-quiz-${{ inputs.prefecture }}.ipa

      # --- Upload to App Store Connect --------------------------------------
      # The API key must live at ~/private_keys/AuthKey_<KEYID>.p8 for altool
      # and notarytool to find it by key id.
      # altool rejects the key ("does not contain a valid authentication key")
      # unless the PEM is byte-exact: real newlines, and a trailing newline.
      # A secret pasted from a terminal or JSON often arrives with literal "\n"
      # or as one long line, so normalise both cases here. The diagnostics below
      # only print the key's shape (line count, header/footer), never its body.
      - name: Stage App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::ASC_KEY_ID / ASC_PRIVATE_KEY secrets are not set."
            exit 1
          fi
          mkdir -p ~/private_keys
          KEY_PATH=~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # 1. literal backslash-n -> real newline
          printf '%s' "$ASC_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$KEY_PATH"

          # 2. if it is still a single line, rebuild the PEM by wrapping the
          #    base64 body at 64 chars between the BEGIN/END markers
          if [ "$(wc -l < "$KEY_PATH")" -le 1 ]; then
            echo "Key arrived as a single line; rebuilding PEM line breaks."
            BODY=$(tr -d '\n\r ' < "$KEY_PATH" \
              | sed -e 's/-----BEGINPRIVATEKEY-----//' -e 's/-----ENDPRIVATEKEY-----//')
            {
              echo "-----BEGIN PRIVATE KEY-----"
              echo "$BODY" | fold -w 64
              echo "-----END PRIVATE KEY-----"
            } > "$KEY_PATH"
          fi

          # 3. guarantee a trailing newline
          [ -n "$(tail -c 1 "$KEY_PATH")" ] && echo >> "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "--- key shape (no secret content) ---"
          echo "lines: $(wc -l < "$KEY_PATH")"
          echo "first: $(head -n 1 "$KEY_PATH")"
          echo "last:  $(tail -n 1 "$KEY_PATH")"
          if ! head -n 1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::ASC_PRIVATE_KEY does not start with -----BEGIN PRIVATE KEY-----. Paste the whole .p8 file, including the BEGIN/END lines."
            exit 1
          fi
          # Final proof the bytes really are a usable EC private key.
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "::error::The staged .p8 is not a parseable private key. Re-copy the AuthKey_<KEYID>.p8 file contents verbatim."
            exit 1
          fi
          echo "openssl: key parses OK"

      - name: Locate .ipa
        id: findipa
        run: |
          IPA="$(find ./ipa -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found under ./ipa"
            exit 1
          fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Found $IPA ($(du -h "$IPA" | cut -f1))"

      - name: Validate with App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app \
            -f "${{ steps.findipa.outputs.path }}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "${{ steps.findipa.outputs.path }}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove staged key
        if: always()
        run: rm -rf ~/private_keys
